<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 미리 불러오기 예제</title>
    <style>
        /* 초기에는 이미지를 숨깁니다. */
        #myImage {
            display: none;
            width: 300px;
            height: auto;
            border: 1px solid blue; /* 로드되었는지 확인용 */
        }
    </style>
</head>
<body>

    <h1>이미지 로딩 테스트</h1>

<img id="myImage" src="app://assets/room/stony_dirt_path_diff_2k.jpg" alt="미리 로드된 이미지" onerror="console.error('img 태그를 통한 이미지 로드 실패!');">
    <!-- <img id="myImage" src="https://i.namu.wiki/i/ssHTvk9KsNtop6OqXQ5osIBughO0g2tmsxFrlhQpnsRjXsWVrPKgR4Zza7dyt7cv8j_ZMbU-EYSh3w7fn9IMPA.webp" alt="미리 로드된 이미지" onerror="console.error('img 태그를 통한 이미지 로드 실패!');"> -->

    <button onclick="showImage()">이미지 보여주기</button>

    <script>
        const myImage = document.getElementById('myImage');

        // 이미지가 성공적으로 로드되었을 때 실행될 함수
        myImage.onload = function() {
            console.log('이미지 로딩 완료 (onload 이벤트)!');
            // 이 시점에 이미지는 메모리에 로드되어 있습니다.
            // 아직 화면에는 보이지 않습니다 (display: none 때문).

            // 이곳에서 다른 자바스크립트 로직을 수행할 수 있습니다.
            // 예를 들어, Three.js 텍스처로 사용하거나, 다른 계산을 하거나.

            // (선택 사항) 만약 여기서 바로 보여주고 싶다면
            // this.style.display = 'block';
        };

        // 이미지 로딩 실패 시
        myImage.onerror = function() {
            console.error('이미지 로드 실패: ' + this.src);
        };

        // 버튼 클릭 시 이미지를 보이게 하는 함수
        function showImage() {
            if (myImage.complete) { // 이미지가 이미 로딩 완료되었는지 확인
                console.log('이미지 로딩이 완료되어 바로 표시합니다.');
                myImage.style.display = 'block'; // 이미지를 보이게 함
            } else {
                console.log('이미지 로딩 중이거나 아직 시작되지 않았습니다. 로딩 완료 후 표시합니다.');
                // 이미지가 아직 로딩 중이라면 onload 이벤트 핸들러가 나중에 처리할 것입니다.
                myImage.style.display = 'block'; // 일단 보이게 설정하여 로드 강제
            }
        }

        console.log('HTML 파싱 완료. 이미지 로딩을 기다리는 중...');

        // DOMContentLoaded는 HTML 구조가 모두 로드되었을 때 발생합니다.
        // 이때 이미지가 이미 로딩을 시작했을 수 있습니다.
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded 이벤트 발생.');
            // 여기서 이미지의 로딩 상태를 확인할 수 있습니다.
            if (myImage.complete) {
                console.log('DOMContentLoaded 시점에 이미지가 이미 로딩 완료되었습니다.');
            } else {
                console.log('DOMContentLoaded 시점에 이미지가 아직 로딩 중이거나 시작되지 않았습니다.');
            }
        });
    </script>

</body>
</html>
